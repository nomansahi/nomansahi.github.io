name: Deploy portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out portfolio
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir _site
          cp index.html noman-ali-cv.pdf supplyon-experience-letter.pdf _site/
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Cancel stale Pages deployment (one-time recovery)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST repos/nomansahi/nomansahi.github.io/pages/deployments/7bca13f06b1779ceb5b2e97614f3eb35f7fa73ba/cancel
          for attempt in {1..24}; do
            state=$(gh api repos/nomansahi/nomansahi.github.io/pages/deployments/7bca13f06b1779ceb5b2e97614f3eb35f7fa73ba/status --jq '.status')
            echo "Previous deployment status: $state"
            case "$state" in
              deployment_cancelled|cancelled|canceled|deployment_failed|failed|errored|succeed|success) break ;;
            esac
            sleep 5
          done
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
